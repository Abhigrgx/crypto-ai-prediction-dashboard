<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Crypto Intelligence Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --success-green: #22c55e;
            --danger-red: #ef4444;
            --border-color: #334155;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard { width: 100%; max-width: 900px; padding: 40px; }
        .header { text-align: center; margin-bottom: 40px; }
        
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            background: linear-gradient(90deg, var(--accent-blue), #818cf8);
            -webkit-background-clip: text;
            background-clip: text; /* Fixed CSS Warning */
            -webkit-text-fill-color: transparent;
        }

        .header p { color: var(--text-muted); font-size: 1.1rem; margin: 0; }
        .grid-container { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
        label { font-weight: 600; color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }
        select { background-color: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border-color); padding: 14px; border-radius: 8px; font-size: 1rem; font-family: 'Inter', sans-serif; cursor: pointer; outline: none; transition: border-color 0.2s; }
        select:focus { border-color: var(--accent-blue); }
        
        button {
            width: 100%; background-color: var(--accent-blue); color: #0f172a; border: none; padding: 16px; border-radius: 8px;
            font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s ease; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        button:hover { background-color: #7dd3fc; transform: translateY(-2px); }
        
        .results-container { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center; }
        .placeholder-text { color: var(--text-muted); font-size: 1.1rem; font-weight: 400; }
        .price-row { display: flex; justify-content: space-between; width: 100%; margin-top: 20px; gap: 20px; }
        .price-box { background-color: var(--bg-dark); padding: 20px; border-radius: 12px; flex: 1; border: 1px solid var(--border-color); }
        .price-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .price-value { font-size: 2rem; font-weight: 700; }
        .trend-badge { margin-top: 24px; display: inline-block; padding: 8px 16px; border-radius: 30px; font-weight: 600; font-size: 0.9rem; letter-spacing: 0.5px; }
        
        .spinner { width: 40px; height: 40px; border: 4px solid var(--border-color); border-top: 4px solid var(--accent-blue); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 768px) { .grid-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <h1>Crypto Intelligence AI</h1>
            <p>Advanced Deep Learning LSTM Prediction Engine</p>
        </div>

        <div class="grid-container">
            <div class="card">
                <div class="input-group">
                    <label for="coin-selector">Target Asset</label>
                    <select id="coin-selector">
                        <option value="BTC-USD">Bitcoin (BTC)</option>
                        <option value="ETH-USD">Ethereum (ETH)</option>
                        <option value="SOL-USD">Solana (SOL)</option>
                    </select>
                </div>
                <button onclick="askAI()">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    Run Neural Network
                </button>
            </div>

            <div class="card">
                <div id="results-card" class="results-container">
                    <div class="placeholder-text">
                        <svg width="48" height="48" fill="none" stroke="var(--border-color)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" style="margin-bottom: 10px;"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                        <br>
                        Select an asset to generate an AI forecast.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function askAI() {
            const selectedCoin = document.getElementById('coin-selector').value;
            const resultsCard = document.getElementById('results-card');
            
            resultsCard.innerHTML = `
                <div class="spinner"></div>
                <div style="color: var(--accent-blue); font-weight: 600;">Connecting to Prediction Engine...</div>
                <div style="color: var(--text-muted); font-size: 0.9rem; margin-top: 8px;">Analyzing 360 days of market volume and FinBERT sentiment...</div>
            `;

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ coin: selectedCoin })
                });

                const data = await response.json();

                if (data.error) {
                    resultsCard.innerHTML = `
                        <div style="color: var(--danger-red);">
                            <h3 style="margin-top: 10px;">System Error</h3>
                            <p>${data.error}</p>
                        </div>
                    `;
                    return;
                }

                // AI Trend Colors
                const isUpward = data.predicted_price > data.current_price;
                const aiColorHex = isUpward ? 'var(--success-green)' : 'var(--danger-red)';
                const aiTrendIcon = isUpward ? '↗' : '↘';
                const aiBgAlpha = isUpward ? 'rgba(34, 197, 94, 0.1)' : 'rgba(239, 68, 68, 0.1)';

                // 24h Change Colors
                const isPos24h = data.pct_change_24h >= 0;
                const pctColor = isPos24h ? 'var(--success-green)' : 'var(--danger-red)';
                const pctArrow = isPos24h ? '↑' : '↓';
                const pctText = `${pctArrow} ${Math.abs(data.pct_change_24h).toFixed(2)}% (24h)`;

                resultsCard.innerHTML = `
                    <h2 style="margin: 0 0 5px 0; font-size: 1.5rem; color: var(--text-main);">${data.coin} Forecast</h2>
                    <p style="margin: 0; color: var(--text-muted); font-size: 0.9rem;">LSTM Output Vector (360-Day Lookback)</p>
                    
                    <div class="price-row">
                        <div class="price-box">
                            <div class="price-label">Current Price</div>
                            <div class="price-value">$${data.current_price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                            <div style="color: ${pctColor}; font-weight: 600; font-size: 1.1rem; margin-top: 8px; letter-spacing: 0.5px;">
                                ${pctText}
                            </div>
                        </div>
                        <div class="price-box" style="border-color: ${aiColorHex};">
                            <div class="price-label" style="color: ${aiColorHex};">Predicted (T+1)</div>
                            <div class="price-value" style="color: ${aiColorHex};">$${data.predicted_price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                        </div>
                    </div>

                    <div class="trend-badge" style="background-color: ${aiBgAlpha}; color: ${aiColorHex}; border: 1px solid ${aiColorHex};">
                        ${aiTrendIcon} ${data.trend}
                    </div>
                `;
            } catch (error) {
                resultsCard.innerHTML = `<h3 style="color: var(--danger-red);">❌ Network Failure. Ensure Flask server is running.</h3>`;
            }
        }
    </script>

</body>
</html>
